<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MAULI MEDICOSE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --primary: #064e3b;
      --primary-light: #047857;
      --gold: #d97706;
      --gold-light: #fef3c7;
      --gold-dark: #b45309;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --danger: #ef4444;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); padding-bottom: 90px; }
    header { background: linear-gradient(135deg, #064e3b, #022c22); color: white; padding: 20px 16px 16px; border-bottom: 3px solid var(--gold); position: sticky; top: 0; z-index: 50; }
    .store-badge { display: inline-flex; align-items: center; background: rgba(217,119,6,0.2); border: 1px solid var(--gold); border-radius: 9999px; padding: 2px 10px; font-size: 11px; font-weight: 700; color: #fbbf24; text-transform: uppercase; }
    .sync-status { float: right; font-size: 11px; padding: 2px 8px; border-radius: 12px; background: rgba(255,255,255,0.15); display: flex; align-items: center; gap: 4px; }
    .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: #10b981; display: inline-block; }
    .sync-dot.syncing { background: #f59e0b; animation: pulse 1s infinite; }
    @keyframes pulse { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }
    .store-title { font-family: 'Playfair Display', serif; font-size: 24px; font-weight: 700; color: #ffffff; margin-top: 4px; }
    .store-owner { font-size: 13px; color: #a7f3d0; margin-top: 2px; }
    .store-meta { font-size: 11px; color: #94a3b8; margin-top: 4px; line-height: 1.4; }
    .contact-row { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; margin-top: 10px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.1); font-size: 12px; font-weight: 600; }
    .contact-link { color: #f8fafc; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
    .container { max-width: 600px; margin: 0 auto; padding: 16px; }
    .search-box { position: relative; margin-bottom: 16px; }
    .search-box input { width: 100%; padding: 12px 16px 12px 42px; border-radius: 9999px; border: 1px solid var(--border); background: #ffffff; font-size: 14px; outline: none; box-shadow: var(--shadow); }
    .search-box i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
    .nav-tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 16px; }
    .tab-btn { background: #ffffff; border: 1px solid var(--border); padding: 10px 4px; border-radius: var(--radius); display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; color: var(--text-muted); cursor: pointer; }
    .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
    .card { background: var(--card-bg); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; border: 1px solid var(--border); box-shadow: var(--shadow); position: relative; }
    .card-title { font-size: 16px; font-weight: 700; color: var(--primary); margin-bottom: 4px; }
    .card-subtitle { font-size: 13px; color: var(--text-muted); margin-bottom: 6px; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; }
    .badge-gold { background: var(--gold-light); color: var(--gold-dark); }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; }
    .btn-primary { background: var(--primary); color: white; width: 100%; margin-top: 8px; }
    .btn-danger { background: #fee2e2; color: #b91c1c; padding: 4px 8px; font-size: 11px; border-radius: 4px; border: none; cursor: pointer; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; color: var(--text); }
    .form-group input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border); font-size: 14px; outline: none; }
  </style>
</head>
<body>

<header>
  <div style="display: flex; justify-content: space-between; align-items: center;">
    <span class="store-badge">CHEMIST & DRUGGIST</span>
    <span class="sync-status"><span id="syncDot" class="sync-dot"></span> <span id="syncText">Live Cloud</span></span>
  </div>
  <div class="store-title">MAULI MEDICOSE</div>
  <div class="store-owner">Proprietor: Anurag Pradip Chavhan</div>
  <div class="store-meta">
    D.L. No.: 20-592435, 21-592436<br>
    1 New Subhedar Layout, Subhedar Layout Road, Nagpur
  </div>
  <div class="contact-row">
    <a href="tel:8149524882" class="contact-link"><i data-lucide="phone" style="width: 14px; height: 14px; stroke: #fff;"></i> 8149524882</a>
    <a href="mailto:maulimedicos@gmail.com" class="contact-link"><i data-lucide="mail" style="width: 14px; height: 14px; stroke: #fff;"></i> maulimedicos@gmail.com</a>
  </div>
</header>

<div class="container">
  <div class="search-box">
    <i data-lucide="search" style="width: 18px; height: 18px;"></i>
    <input type="text" id="searchInput" placeholder="Search brand or salt..." oninput="filterItems()">
  </div>

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('catalog')"><i data-lucide="layout-grid"></i>Catalog</button>
    <button class="tab-btn" onclick="switchTab('classification')"><i data-lucide="layers"></i>Category</button>
    <button class="tab-btn" onclick="switchTab('expiry')"><i data-lucide="calendar-off"></i>Expiry</button>
    <button class="tab-btn" onclick="switchTab('admin')"><i data-lucide="plus-circle"></i>Add Med</button>
  </div>

  <!-- Catalog View -->
  <div id="catalogView">
    <div id="medicineList"></div>
  </div>

  <!-- Category View -->
  <div id="categoryView" style="display: none;">
    <div id="categoryList"></div>
  </div>

  <!-- Expiry View -->
  <div id="expiryView" style="display: none;">
    <div id="expiryList"></div>
  </div>

  <!-- Admin View -->
  <div id="adminView" style="display: none;">
    <div class="card">
      <h3 style="margin-bottom: 12px; color: var(--primary);">➕ Add Medicine (Auto Cloud Sync)</h3>
      <div class="form-group">
        <label>Brand Name</label>
        <input type="text" id="medBrand" placeholder="e.g. Paracetamol 650">
      </div>
      <div class="form-group">
        <label>Composition / Salt</label>
        <input type="text" id="medComp" placeholder="e.g. Paracetamol IP">
      </div>
      <div class="form-group">
        <label>Category</label>
        <input type="text" id="medCat" placeholder="e.g. Analgesic / Antipyretic">
      </div>
      <div class="form-group">
        <label>Batch No & Expiry</label>
        <div style="display: flex; gap: 8px;">
          <input type="text" id="medBatch" placeholder="Batch No">
          <input type="date" id="medExp">
        </div>
      </div>
      <div class="form-group">
        <label>Stock Qty</label>
        <input type="number" id="medQty" placeholder="e.g. 50">
      </div>
      <button class="btn btn-primary" onclick="addNewMedicine()">Save & Sync to All Phones</button>
    </div>
  </div>
</div>

<script>
  // 1. Aapki Firebase Key (Direct Realtime Link)
  const firebaseConfig = {
    apiKey: "AIzaSyBsejl6XbkBZPdqYINkwe8HlGsinyCVyX8",
    authDomain: "mmml-78348.firebaseapp.com",
    projectId: "mmml-78348",
    storageBucket: "mmml-78348.firebasestorage.app",
    messagingSenderId: "338588033160",
    appId: "1:338588033160:web:95caf9986a70cbe8cf3f3d"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  let medicines = [];

  // 2. Real-time Live Listener (Isse sabhi phones par bina refresh ke instant change dikhega)
  function initLiveSync() {
    const dot = document.getElementById('syncDot');
    const txt = document.getElementById('syncText');

    db.collection('medicines').onSnapshot((snapshot) => {
      dot.classList.add('syncing');
      txt.innerText = 'Syncing...';

      medicines = [];
      snapshot.forEach(doc => {
        medicines.push({ id: doc.id, ...doc.data() });
      });

      renderCatalog(medicines);
      renderCategories(medicines);
      renderExpiry(medicines);

      setTimeout(() => {
        dot.classList.remove('syncing');
        txt.innerText = 'Live Cloud';
      }, 300);
    });
  }

  // 3. Add Medicine (Aap yahan save karoge, sabhi doctors ke phone mein usi second update hoga)
  async function addNewMedicine() {
    const brand = document.getElementById('medBrand').value.trim();
    const comp = document.getElementById('medComp').value.trim();
    const cat = document.getElementById('medCat').value.trim() || 'General';
    const batch = document.getElementById('medBatch').value.trim() || 'N/A';
    const exp = document.getElementById('medExp').value || '2027-12-31';
    const qty = document.getElementById('medQty').value || 1;

    if (!brand) return alert("Brand name zaroori hai!");

    try {
      await db.collection('medicines').add({
        brand: brand,
        composition: comp,
        category: cat,
        batch: batch,
        expiry: exp,
        qty: parseInt(qty)
      });
      alert("✅ Medicine add ho gayi! Sabhi phones par live update ho gaya.");
      document.getElementById('medBrand').value = '';
      document.getElementById('medComp').value = '';
      document.getElementById('medQty').value = '';
      switchTab('catalog');
    } catch(err) {
      alert("Error: " + err.message);
    }
  }

  // 4. Delete Medicine
  async function deleteMedicine(id) {
    if(confirm("Kya aap ise delete karna chahte hain? Sabhi jagah se hat jayegi.")) {
      await db.collection('medicines').doc(id).delete();
    }
  }

  function renderCatalog(items) {
    const list = document.getElementById('medicineList');
    if (!list) return;
    if(items.length === 0) {
      list.innerHTML = `<div style="text-align:center; padding: 40px; color: var(--text-muted);">Koi medicine nahi hai. 'Add Med' se pehli medicine dalein!</div>`;
      return;
    }
    list.innerHTML = items.map(m => `
      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: start;">
          <div>
            <div class="card-title">${m.brand}</div>
            <div class="card-subtitle">${m.composition || ''}</div>
          </div>
          <span class="badge badge-gold">${m.category}</span>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-size: 12px; color: var(--text-muted);">
          <span>📦 Qty: <b>${m.qty}</b> | 📅 Exp: <b>${m.expiry}</b></span>
          <button class="btn-danger" onclick="deleteMedicine('${m.id}')">Delete</button>
        </div>
      </div>
    `).join('');
  }

  function renderCategories(items) {
    const list = document.getElementById('categoryList');
    if (!list) return;
    const cats = [...new Set(items.map(m => m.category || 'General'))];
    list.innerHTML = cats.map(c => `
      <div class="card">
        <div class="card-title">📁 ${c}</div>
        <div style="font-size: 13px; color: var(--text-muted);">${items.filter(m => m.category === c).length} Products</div>
      </div>
    `).join('');
  }

  function renderExpiry(items) {
    const list = document.getElementById('expiryList');
    if (!list) return;
    list.innerHTML = items.map(m => `
      <div class="card" style="border-left: 4px solid var(--danger);">
        <div class="card-title" style="color: var(--danger);">${m.brand}</div>
        <div style="font-size: 12px; margin-top: 4px;">Batch: <b>${m.batch}</b> | Expiry: <b>${m.expiry}</b></div>
      </div>
    `).join('');
  }

  function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('catalogView').style.display = 'none';
    document.getElementById('categoryView').style.display = 'none';
    document.getElementById('expiryView').style.display = 'none';
    document.getElementById('adminView').style.display = 'none';

    if (tab === 'catalog') {
      document.getElementById('catalogView').style.display = 'block';
    } else if (tab === 'classification') {
      document.getElementById('categoryView').style.display = 'block';
    } else if (tab === 'expiry') {
      document.getElementById('expiryView').style.display = 'block';
    } else if (tab === 'admin') {
      document.getElementById('adminView').style.display = 'block';
    }
    event.currentTarget.classList.add('active');
  }

  function filterItems() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    const filtered = medicines.filter(m => 
      m.brand.toLowerCase().includes(q) || 
      (m.composition && m.composition.toLowerCase().includes(q))
    );
    renderCatalog(filtered);
  }

  window.addEventListener('DOMContentLoaded', () => {
    lucide.createIcons();
    initLiveSync();
  });
</script>

</body>
</html>
