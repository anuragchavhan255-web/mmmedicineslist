    function compressImageFile(file, maxWidth = 800, quality = 0.78) {
      return new Promise((resolve, reject) => {
        if (!file) return resolve('');
        const reader = new FileReader();
        reader.onload = ev => {
          const img = new Image();
          img.onload = () => {
            let w = img.width;
            let h = img.height;
            if (w > maxWidth || h > maxWidth) {
              if (w > h) {
                h = Math.round((h * maxWidth) / w);
                w = maxWidth;
              } else {
                w = Math.round((w * maxWidth) / h);
                h = maxWidth;
              }
            }
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = () => resolve(ev.target.result);
          img.src = ev.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function loadState() {
      try {
        const saved = localStorage.getItem('mauli_medicos_state_v5');
        if (saved) {
          const parsed = JSON.parse(saved);
          S = { ...S, ...parsed };
          if (!S.cfg) S.cfg = { ...DEFAULT_CFG };
          if (!S.cls || !S.cls.length) S.cls = DEFAULT_CLASSIFICATIONS.map(n => ({ id: uid(), name: n }));
          if (!S.dos || !S.dos.length) S.dos = DEFAULT_DOSAGES.map(n => ({ id: uid(), name: n }));
          if (!S.meds || !S.meds.length) S.meds = [...DEFAULT_MEDICINES];
        } else {
          S.cls = DEFAULT_CLASSIFICATIONS.map(n => ({ id: uid(), name: n }));
          S.dos = DEFAULT_DOSAGES.map(n => ({ id: uid(), name: n }));
          S.meds = [...DEFAULT_MEDICINES];
          S.docs = [...DEFAULT_DOCS];
          S.dm = [...DEFAULT_DM];
          S.exp = [...DEFAULT_EXP];
          S.cfg = { ...DEFAULT_CFG };
          saveState();
        }
      } catch (e) {
        console.error('State load fallback', e);
        S.cls = DEFAULT_CLASSIFICATIONS.map(n => ({ id: uid(), name: n }));
        S.dos = DEFAULT_DOSAGES.map(n => ({ id: uid(), name: n }));
        S.meds = [...DEFAULT_MEDICINES];
        S.docs = [...DEFAULT_DOCS];
        S.dm = [...DEFAULT_DM];
        S.exp = [...DEFAULT_EXP];
        S.cfg = { ...DEFAULT_CFG };
      }
      
      try {
        isAdmin = sessionStorage.getItem('mm_isAdmin') === 'true';
      } catch (e) {
        isAdmin = false;
      }
    }

    function saveState() {
      try {
        localStorage.setItem('mauli_medicos_state_v5', JSON.stringify(S));
      } catch (e) {
        showToast('Storage limit reached');
      }
    }

    function showToast(msg) {
      const tb = $('toast-box');
      if (!tb) return;
      tb.textContent = msg;
      tb.classList.remove('opacity-0', 'translate-y-3');
      tb.classList.add('opacity-100', 'translate-y-0');
      setTimeout(() => {
        tb.classList.remove('opacity-100', 'translate-y-0');
        tb.classList.add('opacity-0', 'translate-y-3');
      }, 2300);
    }

    function showDialog({ title, message, icon = 'ℹ', confirmText = 'OK', cancelText = null, onConfirm = null }) {
      $('modal-icon').textContent = icon;
      $('modal-title').textContent = title;
      $('modal-body').textContent = message;

      const actions = $('modal-actions');
      actions.innerHTML = '';

      if (cancelText) {
        const cancelBtn = document.createElement('button');
        cancelBtn.className = 'px-4 py-2 rounded-xl text-xs font-semibold bg-slate-100 text-slate-700 hover:bg-slate-200 transition';
        cancelBtn.textContent = cancelText;
        cancelBtn.onclick = () => {
          $('modal-container').classList.add('hidden');
        };
        actions.appendChild(cancelBtn);
      }

      const confirmBtn = document.createElement('button');
      confirmBtn.className = 'px-5 py-2 rounded-xl text-xs font-bold bg-emerald-700 text-white hover:bg-emerald-800 shadow transition';
      confirmBtn.textContent = confirmText;
      confirmBtn.onclick = () => {
        $('modal-container').classList.add('hidden');
        if (onConfirm) onConfirm();
      };
      actions.appendChild(confirmBtn);

      $('modal-container').classList.remove('hidden');
    }

    function openImageOverlay(src) {
      if (!src) return;
      $('overlay-img').src = src;
      $('image-overlay').classList.remove('hidden');
    }

    function closeImageOverlay() {
      $('image-overlay').classList.add('hidden');
      $('overlay-img').src = '';

    function getDosageIcon(formName) {
      const fn = (formName || '').toLowerCase();
      if (/tablet|tab\b/.test(fn)) return `<svg class="w-3.5 h-3.5 inline mr-1 stroke-current" viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M7 17L17 7"/></svg>`;
      if (/capsule|cap\b/.test(fn)) return `<svg class="w-3.5 h-3.5 inline mr-1 stroke-current" viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="4" y="9" width="16" height="6" rx="3" transform="rotate(-30 12 12)"/><line x1="12" y1="6" x2="12" y2="18"/></svg>`;
      if (/syrup|susp|liquid|solution/.test(fn)) return `<svg class="w-3.5 h-3.5 inline mr-1 stroke-current" viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M10 3h4v3l2 2v12H8V8l2-2z"/><path d="M8 13h8"/></svg>`;
      if (/inject|infus/.test(fn)) return `<svg class="w-3.5 h-3.5 inline mr-1 stroke-current" viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M15 4l5 5M13 6l5 5-8 8-5-5zM8 16l-4 4M12 10l2 2"/></svg>`;
      if (/cream|oint|gel|lotion|sunscreen/.test(fn)) return `<svg class="w-3.5 h-3.5 inline mr-1 stroke-current" viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M8 3h8l-1 5H9zM9 8l-1 13h8l-1-13"/></svg>`;

    }

    function navigate(...newRoute) {
      route = newRoute;
      searchQuery = '';
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });

    function goBack() {
      if (route.length > 1) {
        route.pop();
      } else {
        route = ['home'];

      searchQuery = '';
      render();

      if (!text) return true;
      const q = text.toLowerCase().trim();
      return [
        m.name,
        m.brand,
        m.composition,
        m.company,
        m.cls,
        m.dosage,
        m.batch
      ].some(val => (val || '').toLowerCase().includes(q));

    function calculateDaysLeft(dateStr) {
      if (!dateStr) return null;
      const target = new Date(dateStr);
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      return Math.ceil((target - today) / (1000 * 60 * 60 * 24));
    }

      if (/muscle/.test(n)) return '💪';
      if (/laxat|diarrh/.test(n)) return '🌿';

    function renderMedicines() {

      if (selectedDosageFilter) {
        list = list.filter(m => (m.dosage || '').toLowerCase() === selectedDosageFilter.toLowerCase());

      if (searchQuery) {
        list = list.filter(m => matchesSearch(searchQuery, m));

      const letters = ['ALL', ...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('')];

              placeholder="Search in ${esc(currentDos.name)}..."

            >

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
              ${dosMeds.map(m => renderMedicineCard(m)).join('') || `
                <div class="bg-white rounded-xl p-8 text-center text-slate-400 text-xs sm:col-span-2 border border-slate-200">

                </div>

            </div>
          </div>
        `;

      let list = [...S.dos].sort((a, b) => a.name.localeCompare(b.name));
      if (searchQuery) {
        list = list.filter(d => d.name.toLowerCase().includes(searchQuery.toLowerCase()));
      }

      return `
        <div class="space-y-3 animate-fade-in">
          <div class="relative">
            <input
              type="text"
              placeholder="Search dosage form or medicine..."
              value="${esc(searchQuery)}"
              oninput="handleSearch(this.value)"

              return `
                <div onclick="navigate('dos', '${d.id}')" class="${theme.cardBg} border ${theme.cardBorder} p-3 rounded-2xl shadow-2xs cursor-pointer flex items-center gap-3 transition active:scale-[0.98] group">

          </div>
        </div>
      `;
    }

    function renderDoctors(r) {
      const docId = r[1];
      if (docId) {
        const doc = S.docs.find(d => d.id === docId);
        if (!doc) return `<div class="p-6 text-center text-slate-400">Doctor not found.</div>`;

        const links = S.dm.filter(l => l.doctorId === doc.id);
        const linkedMeds = links.map(l => ({
          ...S.meds.find(m => m.id === l.medId),
          linkId: l.id
        })).filter(m => m.id);

        let filtered = linkedMeds;
        if (searchQuery) filtered = filtered.filter(m => matchesSearch(searchQuery, m));

        return `
          <div class="space-y-3 animate-fade-in">
            <div class="bg-gradient-to-r from-[#02261a] via-[#064e3b] to-[#02261a] p-4 rounded-2xl border-2 border-[#fbbf24]/50 shadow-md flex items-start gap-3 text-white">

              ${isAdmin ? `

                  <button onclick="confirmDeleteDoctor('${doc.id}')" class="text-xs font-bold bg-rose-500/20 px-2.5 py-1 rounded-lg text-rose-300 hover:bg-rose-500/30">Delete</button>
                </div>

            <div class="flex items-center justify-between pt-1">
              <div>
                <h3 class="text-xs font-extrabold uppercase text-slate-700">Prescribed Medicines (${linkedMeds.length})</h3>
                <p class="text-[11px] text-slate-400">Regularly prescribed formulations</p>
              </div>
              ${isAdmin ? `
                <button onclick="openDoctorMedicinePicker('${doc.id}')" class="px-3 py-1.5 rounded-xl bg-sky-700 hover:bg-sky-800 text-white text-xs font-bold transition shadow-xs">

                </button>

            <input

              oninput="handleSearch(this.value)"

            >

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
              ${filtered.map(m => renderMedicineCard(m, { doctorMedicineLinkId: m.linkId })).join('') || `
                <div class="bg-white rounded-xl p-8 text-center text-slate-400 text-xs sm:col-span-2">
                  No medicines linked to this doctor yet. Click "+ Add Medicine" to assign formulations.
                </div>
              `}
            </div>
          </div>
        `;
      }

      let list = S.docs;
      if (searchQuery) {
        list = list.filter(d => (d.name + ' ' + d.qual + ' ' + d.spec + ' ' + d.clinic).toLowerCase().includes(searchQuery.toLowerCase()));
      }

      return `
        <div class="space-y-3 animate-fade-in">
          <div class="flex items-center justify-between">
            <input

              placeholder="Search doctor name, specialty, clinic..."
              value="${esc(searchQuery)}"
              oninput="handleSearch(this.value)"

            ${isAdmin ? `
              <button onclick="openDoctorForm()" class="px-3.5 py-2.5 rounded-xl bg-emerald-700 text-white text-xs font-bold hover:bg-emerald-800 transition whitespace-nowrap">

            ${list.map(d => {

              return `
                <div onclick="navigate('docs', '${d.id}')" class="bg-white p-3.5 rounded-2xl border border-slate-200 hover:border-emerald-500 shadow-xs cursor-pointer flex items-center justify-between group transition">

    function renderExpiry() {
      let list = [...S.exp];

      if (selectedExpiryFilter === 'expired') {
        list = list.filter(x => {
          const d = calculateDaysLeft(x.expiry);
          return d !== null && d <= 0;
        });
      } else if (selectedExpiryFilter === 'near') {
        list = list.filter(x => {
          const d = calculateDaysLeft(x.expiry);
          return d !== null && d > 0 && d <= 90;
        });
      } else if (selectedExpiryFilter === 'nonMoving') {
        list = list.filter(x => x.nonMoving);
      } else if (selectedExpiryFilter === 'moving') {
        list = list.filter(x => !x.nonMoving);
      }

      if (searchQuery) {
        list = list.filter(x => matchesSearch(searchQuery, x));
      }

      list.sort((a, b) => (a.expiry || '9999').localeCompare(b.expiry || '9999'));

      return `
        <div class="space-y-3 animate-fade-in">
          <div class="bg-gradient-to-r from-[#02261a] via-[#064e3b] to-[#02261a] p-3.5 rounded-2xl border-2 border-[#fbbf24]/50 shadow-md flex items-center justify-between text-white">
            <div>
              <span class="text-[10px] font-extrabold text-[#fbbf24] bg-white/10 px-2 py-0.5 rounded-full inline-flex items-center gap-1 shadow-xs border border-[#fbbf24]/30">
                <span>⏳</span> Stock Tracking &amp; Expiry
              </span>
              <h2 class="text-lg font-black text-[#fbbf24] mt-1 tracking-wide uppercase drop-shadow-sm">EXPIRY &amp; NON-MOVING</h2>
              <p class="text-xs text-emerald-200 font-medium">${S.exp.length} total entries tracked</p>
            </div>
            ${isAdmin ? `
              <button onclick="openExpiryForm()" class="px-3 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold transition shadow-xs">
                + Add Batch
              </button>
            ` : ''}
          </div>

          <div class="flex gap-1.5 overflow-x-auto no-scrollbar py-0.5">
            <button onclick="setExpiryFilter('')" class="px-3.5 py-1.5 rounded-full text-xs font-bold transition whitespace-nowrap ${!selectedExpiryFilter ? 'bg-slate-900 text-white shadow-xs' : 'bg-white text-slate-700 border border-slate-200'}">
              All Entries (${S.exp.length})
            </button>
            <button onclick="setExpiryFilter('moving')" class="px-3.5 py-1.5 rounded-full text-xs font-bold transition whitespace-nowrap ${selectedExpiryFilter === 'moving' ? 'bg-emerald-700 text-white shadow-xs' : 'bg-white text-emerald-800 border border-emerald-300'}">
              Active Stock
            </button>
            <button onclick="setExpiryFilter('near')" class="px-3.5 py-1.5 rounded-full text-xs font-bold transition whitespace-nowrap ${selectedExpiryFilter === 'near' ? 'bg-amber-600 text-white shadow-xs' : 'bg-white text-amber-800 border border-amber-300'}">
              Near Expiry (&le; 90d)
            </button>
            <button onclick="setExpiryFilter('expired')" class="px-3.5 py-1.5 rounded-full text-xs font-bold transition whitespace-nowrap ${selectedExpiryFilter === 'expired' ? 'bg-rose-600 text-white shadow-xs' : 'bg-white text-rose-700 border border-rose-300'}">
              Expired
            </button>
            <button onclick="setExpiryFilter('nonMoving')" class="px-3.5 py-1.5 rounded-full text-xs font-bold transition whitespace-nowrap ${selectedExpiryFilter === 'nonMoving' ? 'bg-purple-700 text-white shadow-xs' : 'bg-white text-purple-700 border border-purple-300'}">
              Non-Moving Stock
            </button>
          </div>

          <div class="flex items-center justify-between gap-2">
            <div class="relative flex-1">
              <input
                type="text"
                placeholder="Search batch, medicine, salt..."
                value="${esc(searchQuery)}"
                oninput="handleSearch(this.value)"
                class="w-full pl-9 pr-3 py-2.5 rounded-xl bg-white border border-slate-300 text-sm shadow-xs focus:ring-2 focus:ring-emerald-500 focus:outline-none"
              >
              <span class="absolute left-3 top-3 text-slate-400">🔍</span>
            </div>
            ${isAdmin ? `
              <button onclick="openExpiryForm()" class="px-3.5 py-2.5 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white text-xs font-bold transition whitespace-nowrap shadow-xs flex items-center gap-1.5">
                <span>+</span> Add Medicine Batch
              </button>
            ` : ''}
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
            ${list.map(item => {
              const days = calculateDaysLeft(item.expiry);
              let tag = '';
              if (item.expiry) {
                if (days < 0) {
                  tag = '<span class="bg-rose-600 text-white text-[10px] font-black px-2 py-0.5 rounded shadow-2xs uppercase tracking-wide">Expired</span>';
                } else if (days <= 90) {
                  tag = `<span class="bg-amber-500 text-white text-[10px] font-black px-2 py-0.5 rounded shadow-2xs uppercase tracking-wide">${days}d left</span>`;
                } else {
                  tag = `<span class="bg-emerald-100 text-emerald-900 border border-emerald-300 text-[10px] font-bold px-2 py-0.5 rounded">Exp: ${esc(item.expiry)}</span>`;
                }
              }

              return `
                <div class="bg-white rounded-2xl p-3.5 border-2 border-slate-200/80 hover:border-slate-300 shadow-sm flex items-stretch gap-3 transition">
                  <div class="flex-1 min-w-0 flex flex-col justify-between">
                    <div>
                      <div class="flex items-start justify-between gap-1 flex-wrap">
                        <h4 class="font-extrabold text-base text-rose-600 tracking-tight uppercase leading-snug break-words">
                          ${esc(item.name)}
                        </h4>
                        <div class="flex gap-1 items-center flex-wrap">
                          ${tag}
                          ${item.nonMoving ? '<span class="bg-purple-100 text-purple-900 border border-purple-300 text-[10px] font-bold px-1.5 py-0.5 rounded">Non-Moving</span>' : ''}
                        </div>
                      </div>

                      ${item.composition ? `<p class="text-xs font-semibold text-slate-700 leading-snug mt-0.5">${esc(item.composition)}</p>` : ''}

                      ${item.company ? `<p class="text-xs text-black font-bold mt-1">Mfg: <span class="font-black text-black">${esc(item.company)}</span></p>` : ''}

                      <div class="flex flex-wrap gap-1 mt-1.5">
                        ${item.dosage ? `<span class="text-[10px] font-bold bg-amber-50 text-amber-900 border border-amber-200 px-2 py-0.5 rounded">${esc(item.dosage)}</span>` : ''}
                        ${item.cls ? `<span class="text-[10px] font-bold bg-sky-50 text-sky-900 border border-sky-200 px-2 py-0.5 rounded">${esc(item.cls)}</span>` : ''}
                      </div>
                    </div>

                    <div class="mt-2.5 pt-2 border-t border-slate-100 flex items-center justify-between flex-wrap gap-2 text-xs">
                      <div class="text-black font-mono space-y-0.5">
                        <div>Batch: <b class="text-black font-extrabold">${esc(item.batch || '—')}</b></div>
                        <div>Amount: <b class="text-black font-extrabold">₹${esc(item.mrp || '0')}</b></div>
                      </div>

                      <div class="bg-slate-100 border border-slate-300 text-black px-3 py-1 rounded-xl text-center shadow-2xs">
                        <span class="block text-base font-black text-black leading-none">${esc(item.qty || '0')}</span>
                        <span class="text-[9px] font-black text-slate-700 uppercase tracking-wider">QTY</span>
                      </div>
                    </div>

                    ${isAdmin ? `
                      <div class="mt-2 pt-1.5 flex gap-2">
                        <button onclick="openExpiryForm('${item.id}')" class="text-[11px] font-bold bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1 rounded-lg">Edit</button>
                        <button onclick="confirmDeleteExpiry('${item.id}')" class="text-[11px] font-bold bg-rose-50 hover:bg-rose-100 text-rose-700 px-2.5 py-1 rounded-lg">Delete</button>
                      </div>
                    ` : ''}
                  </div>

                  <div class="flex-shrink-0 flex items-center justify-center">
                    ${item.photo ? `
                      <img src="${item.photo}" onclick="openImageOverlay('${item.photo}')" class="w-24 h-24 sm:w-28 sm:h-28 rounded-2xl object-cover border-2 border-slate-200 shadow-sm cursor-pointer active:scale-95 transition" alt="Medicine photo">
                    ` : `
                      <div onclick="${isAdmin ? `openExpiryForm('${item.id}')` : ''}" class="w-24 h-24 sm:w-28 sm:h-28 rounded-2xl bg-gradient-to-br from-slate-50 to-slate-100 border-2 border-dashed border-slate-300 flex flex-col items-center justify-center text-center p-2 text-slate-400">
                        <span class="text-2xl">📸</span>
                        <span class="text-[10px] font-bold text-slate-500 mt-1">No photo</span>
                      </div>
                    `}
                  </div>
                </div>
              `;
            }).join('') || `
              <div class="bg-white rounded-2xl p-8 text-center text-slate-400 text-xs sm:col-span-2 border border-slate-200">
                No expiry or non-moving entries logged. Tap "+ Add Medicine Batch" to record stock.
              </div>
            `}
          </div>
        </div>
      `;
    }

    function setExpiryFilter(f) {
      selectedExpiryFilter = f;
      render();
    }

      const assignedSet = new Set(S.dm.filter(x => x.doctorId === docId).map(x => x.medId));
      let pickerQuery = '';

      function renderPicker() {
        const filtered = S.meds.filter(m => matchesSearch(pickerQuery, m));

        return `
          <div class="space-y-3 animate-fade-in text-left">

            >

            <div class="max-h-[60vh] overflow-y-auto space-y-2 pr-1">
              ${filtered.map(m => {
                const isAdded = assignedSet.has(m.id);
                return `
                  <div class="p-2.5 rounded-xl border border-slate-200 bg-white flex items-center justify-between gap-2 shadow-xs">
                    <div class="min-w-0">
                      <h4 class="font-extrabold text-xs text-slate-900 uppercase truncate">${esc(brandDisplay(m))}</h4>
                      <p class="text-[11px] text-sky-700 font-semibold truncate">${esc(m.composition || '')}</p>
                    </div>
                    ${isAdded ? `
                      <span class="text-[11px] font-bold text-emerald-700 bg-emerald-50 px-2 py-1 rounded">✓ Added</span>
                    ` : `
                      <button onclick="linkMedicineToDoc('${docId}', '${m.id}')" class="px-3 py-1 bg-sky-700 hover:bg-sky-800 text-white text-xs font-bold rounded-lg shadow-xs transition">
                        + Add
                      </button>
                    `}
                  </div>
                `;
              }).join('') || '<div class="text-center text-xs text-slate-400 py-6">No matching medicines found.</div>'}
            </div>

            <div class="pt-2 text-right">
              <button onclick="goBack()" class="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs transition">
                Done
              </button>
            </div>
          </div>
        `;
      }

      $('app-view').innerHTML = `<div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm">${renderPicker()}</div>`;
      
      const searchEl = $('picker-search');
      if (searchEl) {
        searchEl.oninput = e => {
          pickerQuery = e.target.value;
          $('app-view').innerHTML = `<div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm">${renderPicker()}</div>`;
          const inputRe = $('picker-search');
          if (inputRe) {
            inputRe.focus();
            inputRe.setSelectionRange(inputRe.value.length, inputRe.value.length);
          }
        };
      }

      window.linkMedicineToDoc = (dId, mId) => {
        if (!S.dm.some(x => x.doctorId === dId && x.medId === mId)) {
          S.dm.push({ id: uid(), doctorId: dId, medId: mId });
          assignedSet.add(mId);
          saveState();
          showToast('Added to doctor formulation');
          $('app-view').innerHTML = `<div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm">${renderPicker()}</div>`;
        }
      };
    }

          <div class="bg-slate-50 p-3 rounded-xl border border-slate-200">
            <label class="block text-xs font-bold text-slate-800 mb-1">📸 Medicine Photo (Large Right-Side Display)</label>
            <input type="file" id="ef-photo-input" accept="image/*" class="text-xs w-full text-slate-600 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-emerald-700 file:text-white hover:file:bg-emerald-800">
            
            <div id="ef-photo-preview-wrap" class="mt-2.5 ${expPhotoData ? '' : 'hidden'} flex items-center gap-3">
              <img id="ef-photo-preview-img" src="${expPhotoData}" class="w-20 h-20 rounded-xl object-cover border border-slate-300 shadow-xs">
              <div>
                <span class="text-[11px] text-emerald-800 font-bold block">✓ Photo ready</span>
                <button type="button" onclick="clearExpiryPhoto()" class="text-xs text-rose-600 font-bold hover:underline">Remove photo</button>
              </div>
            </div>
          </div>

          <div class="pt-2 flex gap-2">
            <button onclick="saveExpiryData('${expId || ''}')" class="flex-1 py-2.5 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white font-bold text-xs shadow-xs transition">
              ${isEdit ? 'Save Changes' : 'Log Batch / Stock'}
            </button>
            <button onclick="goBack()" class="px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs transition">
              Cancel
            </button>
          </div>
        </div>
      `;

      $('app-view').innerHTML = `<div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm">${content}</div>`;

      const photoInp = $('ef-photo-input');
      if (photoInp) {
        photoInp.onchange = async e => {
          const file = e.target.files[0];
          if (!file) return;
          try {
            expPhotoData = await compressImageFile(file);
            $('ef-photo-preview-img').src = expPhotoData;
            $('ef-photo-preview-wrap').classList.remove('hidden');
          } catch (err) {
            showToast('Image processing error');
          }
        };
      }

      window.clearExpiryPhoto = () => {
        expPhotoData = '';
        if (photoInp) photoInp.value = '';
        $('ef-photo-preview-wrap').classList.add('hidden');
      };

      window.autoFillExpiryFromCatalog = medId => {
        const m = S.meds.find(x => x.id === medId);
        if (m) {
          $('ef-name').value = brandDisplay(m);
          $('ef-comp').value = m.composition || '';
          $('ef-company').value = m.company || '';
          if ($('ef-dosage-custom')) $('ef-dosage-custom').value = m.dosage || '';
          if ($('ef-cls-custom')) $('ef-cls-custom').value = m.cls || '';
          if (m.photo && !expPhotoData) {
            expPhotoData = m.photo;
            $('ef-photo-preview-img').src = expPhotoData;
            $('ef-photo-preview-wrap').classList.remove('hidden');
          }
        }
      };

      window.saveExpiryData = id => {
        const name = $('ef-name').value.trim();
        const comp = $('ef-comp').value.trim();
        const company = $('ef-company').value.trim();
        const dosageVal = $('ef-dosage-custom') ? $('ef-dosage-custom').value.trim() : '';
        const clsVal = $('ef-cls-custom') ? $('ef-cls-custom').value.trim() : '';
        const batch = $('ef-batch').value.trim();
        const mrp = $('ef-mrp').value.trim();
        const qty = Number($('ef-qty').value) || 0;
        const expiry = $('ef-expiry').value;
        const typeRadios = document.getElementsByName('ef-type');
        const nonMoving = Array.from(typeRadios).find(r => r.checked)?.value === 'nonmoving';
        let medId = $('ef-pick').value;
        const syncStore = $('ef-sync-store') ? $('ef-sync-store').checked : true;

        if (!name) {
          showToast('Medicine name required');
          return;
        }

        if (dosageVal && !S.dos.some(d => d.name.toLowerCase() === dosageVal.toLowerCase())) {
          S.dos.push({ id: uid(), name: dosageVal });
        }

        if (clsVal && !S.cls.some(c => c.name.toLowerCase() === clsVal.toLowerCase())) {
          S.cls.push({ id: uid(), name: clsVal });
        }

        if (syncStore) {
          let existingMed = medId ? S.meds.find(m => m.id === medId) : null;
          if (!existingMed) {
            existingMed = S.meds.find(m => 
              (m.brand || m.name || '').toLowerCase() === name.toLowerCase() ||
              (comp && (m.composition || '').toLowerCase() === comp.toLowerCase())
            );
          }

          if (existingMed) {
            existingMed.inStore = true;
            if (dosageVal) existingMed.dosage = dosageVal;
            if (clsVal) existingMed.cls = clsVal;
            if (company && !existingMed.company) existingMed.company = company;
            if (comp && !existingMed.composition) existingMed.composition = comp;
            if (expPhotoData && !existingMed.photo) existingMed.photo = expPhotoData;
            medId = existingMed.id;
          } else {
            const newMedId = uid();
            S.meds.unshift({
              id: newMedId,
              brand: name,
              name: name,
              composition: comp || name,
              company: company,
              dosage: dosageVal,
              cls: clsVal,
              photo: expPhotoData,
              inStore: true
            });
            medId = newMedId;
          }
        }

        if (id) {
          const idx = S.exp.findIndex(x => x.id === id);
          if (idx !== -1) {
            S.exp[idx] = {
              ...S.exp[idx],
              name,
              composition: comp,
              company,
              dosage: dosageVal,
              cls: clsVal,
              batch,
              mrp,
              qty,
              expiry,
              nonMoving,
              medId,
              photo: expPhotoData || S.exp[idx].photo
            };
          }
        } else {
          S.exp.push({
            id: uid(),
            name,
            composition: comp,
            company,
            dosage: dosageVal,
            cls: clsVal,
            batch,
            mrp,
            qty,
            expiry,
            nonMoving,
            medId,
            photo: expPhotoData
          });
        }

        saveState();
        showToast(id ? 'Batch entry updated' : 'Added to Expiry & Mauli List');
        goBack();
      };
    }

    function confirmDeleteMedicine(id) {
      showDialog({
        title: 'Delete Medicine',
        message: 'Delete this medicine from catalogue and doctor prescriptions?',
        icon: '🗑️',
        confirmText: 'Delete',
        cancelText: 'Cancel',
        onConfirm: () => {
          S.meds = S.meds.filter(m => m.id !== id);
          S.dm = S.dm.filter(l => l.medId !== id);
          saveState();
          showToast('Medicine deleted');
          render();
        }
      });
    }

    function addToStoreList(id) {
      const idx = S.meds.findIndex(m => m.id === id);
      if (idx !== -1) {
        S.meds[idx].inStore = true;
        saveState();
        showToast('Added to Store Medicine List');
        render();
      }
    }

    function confirmDeleteDoctor(id) {
      showDialog({
        title: 'Delete Doctor',
        message: 'Delete doctor and all assigned prescription linkages?',
        icon: '🗑️',
        confirmText: 'Delete',
        cancelText: 'Cancel',
        onConfirm: () => {
          S.docs = S.docs.filter(d => d.id !== id);
          S.dm = S.dm.filter(l => l.doctorId !== id);
          saveState();
          showToast('Doctor profile removed');
          goBack();
        }
      });
    }

    function confirmDeleteExpiry(id) {
      showDialog({
        title: 'Delete Batch Record',
        message: 'Delete this expiry / batch entry?',
        icon: '🗑️',
        confirmText: 'Delete',
        cancelText: 'Cancel',
        onConfirm: () => {
          S.exp = S.exp.filter(x => x.id !== id);
          saveState();
          showToast('Batch record deleted');
          render();
        }
      });
    }

    function promptAddCategory(type) {
      const isCls = type === 'cls';
      const label = isCls ? 'Therapeutic Class' : 'Dosage Form';
      
      const content = `
        <div class="space-y-3 text-left">
          <h3 class="text-sm font-bold text-slate-900">Add New ${label}</h3>
          <input id="cat-input-name" placeholder="e.g. ${isCls ? 'Cardiovascular' : 'Suspension'}" class="w-full p-2.5 rounded-xl border border-slate-300 text-sm font-bold focus:ring-2 focus:ring-emerald-500 focus:outline-none">
          <div class="flex gap-2 justify-end pt-1">
            <button onclick="$('modal-container').classList.add('hidden')" class="px-3 py-1.5 rounded-xl bg-slate-100 text-xs font-semibold text-slate-700">Cancel</button>
            <button onclick="commitAddCategory('${type}')" class="px-4 py-1.5 rounded-xl bg-emerald-700 text-white text-xs font-bold hover:bg-emerald-800">Add</button>
          </div>
        </div>
      `;

      $('modal-icon').textContent = isCls ? '🧬' : '💊';
      $('modal-title').textContent = `New ${label}`;
      $('modal-body').innerHTML = content;
      $('modal-actions').innerHTML = '';
      $('modal-container').classList.remove('hidden');

      window.commitAddCategory = t => {
        const val = $('cat-input-name').value.trim();
        if (!val) return;
        if (S[t].some(x => x.name.toLowerCase() === val.toLowerCase())) {
          showToast('Already exists');
          return;
        }
        S[t].push({ id: uid(), name: val });
        saveState();
        $('modal-container').classList.add('hidden');
        showToast(`Added ${val}`);
        render();
      };
    }

    function renameCategory(type, id) {
      const obj = S[type].find(x => x.id === id);
      if (!obj) return;
      const isCls = type === 'cls';

      const content = `
        <div class="space-y-3 text-left">
          <h3 class="text-sm font-bold text-slate-900">Rename ${isCls ? 'Class' : 'Dosage Form'}</h3>
          <input id="cat-rename-input" value="${esc(obj.name)}" class="w-full p-2.5 rounded-xl border border-slate-300 text-sm font-bold focus:ring-2 focus:ring-emerald-500 focus:outline-none">
          <div class="flex gap-2 justify-end pt-1">
            <button onclick="$('modal-container').classList.add('hidden')" class="px-3 py-1.5 rounded-xl bg-slate-100 text-xs font-semibold text-slate-700">Cancel</button>
            <button onclick="commitRenameCategory('${type}', '${id}')" class="px-4 py-1.5 rounded-xl bg-emerald-700 text-white text-xs font-bold hover:bg-emerald-800">Update</button>
          </div>
        </div>
      `;

      $('modal-icon').textContent = '✏️';
      $('modal-title').textContent = 'Rename';
      $('modal-body').innerHTML = content;
      $('modal-actions').innerHTML = '';
      $('modal-container').classList.remove('hidden');

      window.commitRenameCategory = (t, catId) => {
        const newVal = $('cat-rename-input').value.trim();
        if (!newVal || newVal === obj.name) {
          $('modal-container').classList.add('hidden');
          return;
        }
        const oldName = obj.name;
        obj.name = newVal;

        const field = t === 'cls' ? 'cls' : 'dosage';
        S.meds.forEach(m => {
          if (m[field] === oldName) m[field] = newVal;
        });

        saveState();
        $('modal-container').classList.add('hidden');
        showToast('Updated successfully');
        render();
      };
    }

    function confirmDeleteCategory(type, id) {
      const obj = S[type].find(x => x.id === id);
      if (!obj) return;

      showDialog({
        title: 'Delete Category',
        message: `Delete "${obj.name}"? Medicines will have this field unassigned.`,
        icon: '🗑️',
        confirmText: 'Delete',
        cancelText: 'Cancel',
        onConfirm: () => {
          S[type] = S[type].filter(x => x.id !== id);
          saveState();
          showToast('Category deleted');
          goBack();
        }
      });
    }

    function toggleAdminMode() {
      if (isAdmin) {
        isAdmin = false;
        try { sessionStorage.removeItem('mm_isAdmin'); } catch(e) {}
        showToast('Switched to Doctor / Staff View');
        render();
      } else {
        const correctPin = S.cfg.pin || '1234';
        const content = `
          <div class="space-y-3 text-left">
            <p class="text-xs text-slate-500">Please enter the 4-digit Administrator security PIN (Default: <b>1234</b>)</p>
            <input id="admin-pin-input" type="password" maxlength="8" placeholder="••••" class="w-full text-center tracking-widest text-lg font-mono p-2 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
            <div class="flex gap-2 justify-end pt-1">
              <button onclick="$('modal-container').classList.add('hidden')" class="px-3 py-1.5 rounded-xl bg-slate-100 text-xs font-semibold text-slate-700">Cancel</button>
              <button onclick="commitUnlockAdmin('${correctPin}')" class="px-4 py-1.5 rounded-xl bg-emerald-700 text-white text-xs font-bold hover:bg-emerald-800">Unlock</button>
            </div>
          </div>
        `;

        $('modal-icon').textContent = '🔐';
        $('modal-title').textContent = 'Admin PIN Required';
        $('modal-body').innerHTML = content;
        $('modal-actions').innerHTML = '';
        $('modal-container').classList.remove('hidden');

        setTimeout(() => {
          const inp = $('admin-pin-input');
          if (inp) inp.focus();
        }, 80);

        window.commitUnlockAdmin = expected => {
          const typed = $('admin-pin-input').value.trim();
          if (typed === expected) {
            isAdmin = true;
            try { sessionStorage.setItem('mm_isAdmin', 'true'); } catch(e) {}
            $('modal-container').classList.add('hidden');
            showToast('Admin Mode Unlocked');
            render();
          } else {
            showToast('Incorrect PIN');
          }
        };
      }
    }

    function updateAdminPin() {
      const np = $('cfg-new-pin').value.trim();
      if (np.length < 4) {
        showToast('PIN must be at least 4 characters');
        return;
      }
      S.cfg.pin = np;
      saveState();
      showToast('Admin PIN updated');
      render();
    }

    function savePharmacyDetails() {
      S.cfg = {
        ...S.cfg,
        name: $('cfg-name').value.trim(),
        type: $('cfg-type').value.trim(),
        prop: $('cfg-prop').value.trim(),
        pharm: $('cfg-pharm').value.trim(),
        dl: $('cfg-dl').value.trim(),
        phone: $('cfg-phone').value.trim(),
        wa: $('cfg-wa').value.trim(),
        email: $('cfg-email').value.trim(),
        address: $('cfg-address').value.trim()
      };
      saveState();
      showToast('Pharmacy profile saved');
      render();
    }

    function downloadJsonBackup() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(S, null, 2));
      const a = document.createElement('a');
      a.setAttribute("href", dataStr);
      a.setAttribute("download", `mauli_medicos_backup_${new Date().toISOString().slice(0, 10)}.json`);
      document.body.appendChild(a);
      a.click();
      a.remove();
      showToast('Backup downloaded');
    }

    function exportMedicinesCsv() {
      const header = ["Brand", "Composition", "Company", "Dosage", "Category", "InStore"];
      const rows = S.meds.map(m => [
        brandDisplay(m),
        m.composition || '',
        m.company || '',
        m.dosage || '',
        m.cls || '',
        m.inStore !== false ? 'Yes' : 'No'
      ]);

      const csvContent = "data:text/csv;charset=utf-8," + [header, ...rows]
        .map(e => e.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(','))
        .join("\n");

      const a = document.createElement('a');
      a.setAttribute("href", encodeURI(csvContent));
      a.setAttribute("download", `mauli_medicines_${new Date().toISOString().slice(0, 10)}.csv`);
      document.body.appendChild(a);
      a.click();
      a.remove();
      showToast('CSV exported');
    }

    function handleRestoreFile(input) {
      const file = input.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = ev => {
        try {
          const text = ev.target.result;
          if (file.name.endsWith('.json')) {
            const parsed = JSON.parse(text);
            if (parsed.meds && Array.isArray(parsed.meds)) {
              let added = 0;
              const curIds = new Set(S.meds.map(x => x.id));
              parsed.meds.forEach(m => {
                if (!curIds.has(m.id)) {
                  S.meds.push(m);
                  added++;
                }
              });
              if (parsed.docs) {
                const curDocIds = new Set(S.docs.map(x => x.id));
                parsed.docs.forEach(d => { if (!curDocIds.has(d.id)) S.docs.push(d); });
              }
              if (parsed.exp) {
                const curExpIds = new Set(S.exp.map(x => x.id));
                parsed.exp.forEach(e => { if (!curExpIds.has(e.id)) S.exp.push(e); });
              }
              saveState();
              showToast(`Restore complete: +${added} items merged`);
              render();
            } else {
              showToast('Invalid JSON structure');
            }
          } else {
            const lines = text.split(/\r?\n/).filter(x => x.trim());
            let count = 0;
            for (let i = 1; i < lines.length; i++) {
              const cols = lines[i].split(',').map(s => s.trim().replace(/^"|"$/g, ''));
              if (cols[0] || cols[1]) {
                S.meds.push({
                  id: uid(),
                  brand: cols[0] || cols[1],
                  name: cols[1] || cols[0],
                  composition: cols[1] || cols[0],
                  company: cols[2] || '',
                  dosage: cols[3] || '',
                  cls: cols[4] || '',
                  inStore: true
                });
                count++;
              }
            }
            saveState();
            showToast(`Imported ${count} medicines from CSV`);
            render();
          }
        } catch (e) {
          showToast('Failed to parse file: ' + e.message);
        }
      };
      reader.readAsText(file);
      input.value = '';
    }

    function confirmResetDefaults() {
      showDialog({
        title: 'Factory Demo Reset',
        message: 'Restore medicines back to initial factory preset with Sunshade Sunscreen?',
        icon: '⚠️',
        confirmText: 'Reset',
        cancelText: 'Cancel',
        onConfirm: () => {
          localStorage.removeItem('mauli_medicos_state_v5');
          loadState();
          showToast('Reset to Sunshade Sunscreen');
          navigate('home');
        }
      });
    }

    function handleSearch(val) {
      searchQuery = val;
      render();
      const el = $('search-input');
      if (el) {
        el.focus();
        el.setSelectionRange(el.value.length, el.value.length);
      }
    }

    function clearSearch() {
      searchQuery = '';
      render();
    }

    function render() {
      try {
        const headerEl = $('app-header');
        const navEl = $('app-nav');
        const viewEl = $('app-view');

        if (headerEl) headerEl.innerHTML = renderHeader();
        if (navEl) navEl.innerHTML = renderNav();

        if (!viewEl) return;
        const root = route[0];

        if (root === 'home') {
          viewEl.innerHTML = renderHome();
        } else if (root === 'meds') {
          viewEl.innerHTML = renderMedicines();
        } else if (root === 'cls') {
          viewEl.innerHTML = renderClassifications(route);
        } else if (root === 'dos') {
          viewEl.innerHTML = renderDosages(route);
        } else if (root === 'docs') {
          viewEl.innerHTML = renderDoctors(route);
        } else if (root === 'exp') {
          viewEl.innerHTML = renderExpiry();
        } else if (root === 'settings') {
          viewEl.innerHTML = renderSettings();
        } else {
          viewEl.innerHTML = renderHome();
        }
      } catch (err) {
        console.error('Render error:', err);
      }
    }

    function bootstrap() {
      loadState();
      render();
    }

    if (document.readyState === 'loading') {
      window.addEventListener('DOMContentLoaded', bootstrap);
    } else {
      bootstrap();
    }
  </script>
</body>
