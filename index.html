function initRealtimeSync() {
  const collections = ['cls', 'dos', 'docs', 'meds', 'dm', 'exp'];
  collections.forEach(c => {
    col(c).onSnapshot(snapshot => {
      if (!snapshot.empty) {
        const cloudDocs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        if (c === 'cls' || c === 'dos') {
          const map = new Map(S[c].map(x => [x.name.toLowerCase(), x]));
          cloudDocs.forEach(item => map.set(item.name.toLowerCase(), item));
          S[c] = Array.from(map.values());
        } else if (c === 'meds') {
          const map = new Map(S.meds.map(x => [x.id, x]));
          cloudDocs.forEach(item => map.set(item.id, item));
          S.meds = Array.from(map.values());
        } else {
          S[c] = cloudDocs;
        }
        cache();
        draw();
      }
    }, err => console.warn('Sync on ' + c, err));
  });

  col('settings').doc('profile').onSnapshot(doc => {
    if (doc.exists) {
      S.cfg = { ...S.cfg, ...doc.data() };
      cache();
      draw();
    }
  }, err => console.warn('Settings sync', err));
}

async function put(c, o) {
  const id = o.id || uid();
  const d = { ...o, id, updatedAt: now() };
  if (!o.createdAt) d.createdAt = now();
  const idx = S[c].findIndex(x => x.id === id);
  if (idx !== -1) S[c][idx] = d; else S[c].push(d);
  cache();
  draw();
  try {
    await col(c).doc(id).set(d, { merge: true });
  } catch(e) {
    console.warn('Cloud save deferred: ' + (e.message || e.code));
  }
  return id;
}

async function del(c, id) {
  if (!confirm('Delete this record?')) return;
  S[c] = S[c].filter(x => x.id !== id);
  cache();
  draw();
  try {
    await col(c).doc(id).delete();
  } catch(e) {
    alert('Delete notice: ' + e.message);
  }
}

function shrink(file, maxSide = 800) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > maxSide || h > maxSide) {
          if (w > h) { h = Math.round((h * maxSide) / w); w = maxSide; }
          else { w = Math.round((w * maxSide) / h); h = maxSide; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.8));
      };
      img.onerror = () => resolve(ev.target.result);
      img.src = ev.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function parseCsvOrTsv(text) {
  if (!text || !text.trim()) return [];
  const lines = text.trim().split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  if (!lines.length) return [];

  const firstLine = lines[0];
  let delim = ',';
  if (firstLine.includes('\t')) delim = '\t';
  else if (firstLine.includes(';') && !firstLine.includes(',')) delim = ';';

  const splitLine = (str) => {
    if (delim === '\t') return str.split('\t').map(s => s.trim().replace(/^["']|["']$/g, ''));
    const res = [];
    let cur = '', inQuotes = false;
    for (let i = 0; i < str.length; i++) {
      const c = str[i];
      if (c === '"') { inQuotes = !inQuotes; }
      else if (c === delim && !inQuotes) { res.push(cur.trim().replace(/^["']|["']$/g, '')); cur = ''; }
      else { cur += c; }
    }
    res.push(cur.trim().replace(/^["']|["']$/g, ''));
    return res;
  };

  const headers = splitLine(lines[0]).map(h => h.toLowerCase().replace(/[^a-z0-9]/g, ''));
  const hasHeader = headers.some(h => ['brand', 'name', 'itemname', 'item', 'medicine', 'comp', 'composition', 'salt', 'company', 'mfg'].includes(h));

  const items = [];
  const startIndex = hasHeader ? 1 : 0;

  for (let i = startIndex; i < lines.length; i++) {
    const cols = splitLine(lines[i]);
    if (!cols.length || cols.every(c => !c)) continue;

    let brand = '', comp = '', company = '', dosage = '', cls = '';

    if (hasHeader) {
      headers.forEach((h, idx) => {
        const val = cols[idx] || '';
        if (['brand', 'itemname', 'item', 'medicine', 'drug', 'product'].includes(h)) brand = val;
        else if (['name'].includes(h) && !brand) brand = val;
        else if (['comp', 'composition', 'salt', 'generic', 'genericname'].includes(h)) comp = val;
        else if (['company', 'mfg', 'manufacturer'].includes(h)) company = val;
        else if (['dosage', 'form', 'formulation', 'type'].includes(h)) dosage = val;
        else if (['cls', 'classification', 'category', 'therapeutical', 'therapeutic'].includes(h)) cls = val;
      });
    } else {
      brand = cols[0] || '';
      comp = cols[1] || '';
      company = cols[2] || '';
      dosage = cols[3] || '';
      cls = cols[4] || '';
    }

    if (brand || comp) {
      items.push({
        brand: brand || comp,
        name: brand || comp,
        composition: comp || brand,
        company: company || '',
        dosage: dosage || 'Tablet',
        cls: cls || 'Analgesics & Antipyretics'
      });
    }
  }
  return items;
}

function previewImportData(text) {
  const items = parseCsvOrTsv(text);
  const prevBox = $('imp_preview');
  if (items.length) {
    prevBox.style.display = 'block';
    prevBox.innerHTML = `✓ Found <b>${items.length} medicines</b> ready to import. First item: <b>${esc(items[0].brand)}</b> (${esc(items[0].composition || 'No composition')}) - <i>${esc(items[0].company || 'No company')}</i>.`;

window.executeImport = async function() {
  const text = $('imp_text').value;
  const items = parseCsvOrTsv(text);
  if (!items.length) return alert('No valid medicine rows found. Please check format or sample CSV.');

  const isStore = $('imp_target').value === 'store';
  if (!confirm(`Import ${items.length} medicines into ${isStore ? 'Mauli Store List' : 'Master Database'}?`)) return;

  const btn = $('btn_do_import');
  btn.disabled = true;
  btn.innerText = `Importing 0 / ${items.length}...`;

  let addedCount = 0;
  let batchOps = [];

  for (let i = 0; i < items.length; i++) {
    const item = items[i];
    const existing = S.meds.find(m => (m.brand && m.brand.toLowerCase() === item.brand.toLowerCase()) || (m.name && m.name.toLowerCase() === item.name.toLowerCase()));
    
    const medObj = {
      id: existing ? existing.id : uid(),
      brand: item.brand,
      name: item.name,
      composition: item.composition,
      company: item.company,
      dosage: item.dosage,
      cls: item.cls,
      inStore: isStore,
      updatedAt: now()
    };

    if (existing) {
      Object.assign(existing, medObj);
    } else {
      S.meds.push(medObj);
    }

    batchOps.push(medObj);
    addedCount++;

    if (i % 20 === 0 || i === items.length - 1) {
      btn.innerText = `Importing ${i + 1} / ${items.length}...`;
    }
  }

  cache();
  draw();

  try {
    const batchPromises = batchOps.map(m => col('meds').doc(m.id).set(m, { merge: true }));
    for (let c = 0; c < batchPromises.length; c += 50) {
      await Promise.all(batchPromises.slice(c, c + 50));
    }
  } catch(e) {
    console.warn('Batch cloud sync deferred: ', e);
  }

  alert(`✓ Successfully imported ${addedCount} medicines!`);
  back();
};

function triggerRestore() {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.json';
  inp.onchange = async () => {
    try {
      const parsed = JSON.parse(await inp.files[0].text());
      const source = parsed.data || parsed;
      if (!confirm('Merge restore data into database?')) return;
      for (const k of ['cls', 'dos', 'docs', 'meds', 'dm', 'exp']) {
        if (Array.isArray(source[k])) {
          for (const item of source[k]) {
            if (!S[k].some(x => x.id === item.id)) {
              await put(k, item);
            }
          }
        }
      }
      alert('Restore complete!');
      draw();
    } catch(e) {
      alert('Invalid backup file');
    }
  };
  inp.click();
}

    $('hd').innerHTML = fullHdr();
  } else if (root === 'docs' && route[1]) {
    const doc = S.docs.find(d => d.id === route[1]);
    if (doc) {
      $('hd').innerHTML = docHdr(doc);
    } else {
      $('hd').innerHTML = subHdr('Doctor Medicines');
    }
  } else {
    let title = 'MAULI MEDICOSE';
    if (root === 'meds') title = tab === 'master' && isA() ? 'Master Medicine List' : 'Mauli Medicine List';
    else if (root === 'cls') title = route[1] ? (S.cls.find(x => x.id === route[1])?.name || 'Class Details') : 'Therapeutic Classification';
    else if (root === 'dos') title = route[1] ? (S.dos.find(x => x.id === route[1])?.name || 'Dosage Details') : 'Dosage Forms';
    else if (root === 'docs') title = 'Prescribing Doctors';
    else if (root === 'exp') title = 'Expiry & Non-Moving';
    else if (root === 'more') title = route[1] === 'set' ? 'Pharmacy Details' : 'Settings';
    $('hd').innerHTML = subHdr(title);
  }

  const tabs = [
    ['home', '🏠', 'Home'],
    ['meds', '📋', 'Mauli List'],
    null,
    ['docs', '🩺', 'Doctors'],
    ['more', '⚙', isA() ? 'Admin' : 'Settings']
  ];

  $('nv').innerHTML = tabs.map(t => {
    if (!t) {
      return `<div class="fab" onclick="handleFab()">${isA() ? '+' : '⌕'}</div>`;
    }
    return `
      <a class="${route[0] === t[0] ? 'on' : ''}" onclick="go('${t[0]}')">
        <i>${t[1]}</i>${t[2]}
      </a>
    `;
  }).join('');

  const viewFn = V[root] || V.home;
  $('m').innerHTML = viewFn(route) + `
    <footer>
      <div class="ft-row">
        <span>© 2026 MAULI MEDICOSE. All Rights Reserved.</span>
        <span class="ft-div">|</span>
        <span class="sy2"><span class="sy2-dot"></span> CLOUD SYNC LIVE</span>
      </div>
      <span class="sub">Registered Pharmacy Inventory System</span>
    </footer>
  `;
}

function handleFab() {
  if (isA()) {
    medForm();
  } else {
    go('meds');
    setTimeout(() => {
      const el = $('sq');
      if (el) el.focus();
    }, 80);
  }
}

initRealtimeSync();
draw();
</script>
</body>
</html>
