<script>
/* 1. Firebase Live Cloud Configuration */
const firebaseConfig = {

let asAdmin = false;

/* Helper functions */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const now = () => new Date().toISOString();
const col = n => db.collection(n);

/* Cache fallback */
function cache(){
  try { localStorage.setItem('mauli_local_cache', JSON.stringify(S)); } catch(e){}
}
try {
  const cached = JSON.parse(localStorage.getItem('mauli_local_cache'));
  if (cached) S = { ...S, ...cached, cfg: { ...S.cfg, ...(cached.cfg || {}) } };
} catch(e){}

function initRealtimeSync() {
  const collections = ['cls', 'dos', 'docs', 'meds', 'dm', 'exp'];
  collections.forEach(c => {
    col(c).onSnapshot(snapshot => {
      S[c] = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      cache();
      draw();
      if (c === 'cls' || c === 'dos' || c === 'meds') checkSeed();
    }, err => {
      console.warn('Realtime error on ' + c, err);
    });
  });

  // Settings & Profile Sync
  col('settings').doc('profile').onSnapshot(doc => {
    if (doc.exists) {
      S.cfg = { ...S.cfg, ...doc.data() };
      cache();
      draw();
    } else {
      // First time init settings on cloud
      col('settings').doc('profile').set(S.cfg);
    }
  }, err => console.warn('Settings err', err));
}

/* Cloud write helpers */
async function put(c, o) {
  const id = o.id || uid();
  const d = { ...o, id, updatedAt: now() };
  if (!o.createdAt) d.createdAt = now();
  try {
    await col(c).doc(id).set(d, { merge: true });
    // Local optimistic update
    const idx = S[c].findIndex(x => x.id === id);
    if (idx !== -1) S[c][idx] = d; else S[c].push(d);
    cache();
    draw();
  } catch(e) {
    alert('Cloud Save failed: ' + (e.message || e.code));
  }
  return id;
}

async function del(c, id) {
  if (!confirm('Delete this record? This action cannot be undone.')) return;
  try {
    await col(c).doc(id).delete();
    S[c] = S[c].filter(x => x.id !== id);
    cache();
    draw();
  } catch(e) {
    alert('Delete failed: ' + e.message);
  }
}

const DEFAULT_CLS = [

let seeded = false;
async function checkSeed() {
  if (seeded || !asAdmin) return;
  seeded = true;
  if (!S.cls.length) {

}

}

function shrink(file, maxSide = 900) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > maxSide || h > maxSide) {
          if (w > h) { h = Math.round((h * maxSide) / w); w = maxSide; }
          else { w = Math.round((w * maxSide) / h); h = maxSide; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.8));
      };
      img.onerror = () => resolve(ev.target.result);
      img.src = ev.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

const SV = d => `<svg class="dic" viewBox="0 0 24 24">${d}</svg>`;

const find = (s, m) => !s || [m.name, m.brand, m.composition, m.company, m.cls, m.dosage, m.batch].some(v => (v || '').toLowerCase().includes(s.toLowerCase()));

window.handlePhotoUpload = async function(inp) {
  const f = inp.files[0];
  if (!f) return;
  try {
    activePhoto = await shrink(f);
    $('photo_preview_img').src = activePhoto;
    $('photo_preview_wrap').style.display = 'flex';
  } catch(e) {
    alert('Could not process photo');
  }
};

async function saveMed(id) {
  const brand = $('f_brand').value.trim();
  const comp = $('f_comp').value.trim();
  if (!brand && !comp) return alert('Brand name or composition required');

  const medData = {
    brand: brand || comp,
    name: brand || comp,
    composition: comp || brand,
    company: $('f_co').value.trim(),
    dosage: $('f_dos').value,
    cls: $('f_cls').value,
    photo: activePhoto,
    inStore: true
  };

  await put('meds', { ...medData, id: id || undefined });
  back();
}

async function delMed(id) {
  if (!confirm('Delete this medicine from catalogue and doctor prescriptions?')) return;
  for (const link of S.dm.filter(x => x.medId === id)) {
    await col('dm').doc(link.id).delete();
  }
  await del('meds', id);
}

/* Category handlers */
async function addCat(type, label) {
  const name = (prompt('Enter new ' + label) || '').trim();
  if (!name) return;
  if (S[type].some(x => x.name.toLowerCase() === name.toLowerCase())) return alert('Already exists');
  await put(type, { name });
}

async function renm(type, id) {
  const item = S[type].find(x => x.id === id);
  if (!item) return;
  const n = (prompt('Rename ' + item.name, item.name) || '').trim();
  if (!n || n === item.name) return;
  await put(type, { ...item, name: n });
  const field = type === 'cls' ? 'cls' : 'dosage';
  for (const m of S.meds.filter(x => x[field] === item.name)) {
    await put('meds', { ...m, [field]: n });
  }
}

/* Doctor Form */

  if (!isA()) return alert('Admin mode required');
  const d = S.docs.find(x => x.id === id) || {};
  activePhoto = d.photo || '';

  $('m').innerHTML = `
    ${bk(id ? 'Edit Doctor Profile' : 'Add New Doctor')}
    <div class="card">
      <small style="font-weight:700">Doctor Name *</small>
      <input id="df_name" placeholder="e.g. Dr. Rajesh Sharma" value="${esc(d.name || '')}">
      <small style="font-weight:700">Qualification</small>
      <input id="df_qual" placeholder="e.g. MBBS, MD (Medicine)" value="${esc(d.qual || '')}">
      <small style="font-weight:700">Specialty</small>
      <input id="df_spec" placeholder="e.g. Consultant Physician" value="${esc(d.spec || '')}">
      <small style="font-weight:700">Registration / Note</small>
      <input id="df_extra" placeholder="e.g. Reg. No. 10423" value="${esc(d.extra || '')}">
      <small style="font-weight:700">Clinic / Hospital</small>
      <input id="df_clinic" placeholder="e.g. Subhedar Hospital" value="${esc(d.clinic || '')}">
      
      <div style="background:#f1f5f4;padding:10px;border-radius:10px;margin:8px 0">
        <small style="font-weight:700;display:block;margin-bottom:4px">Doctor Photo (Optional)</small>
        <input type="file" id="df_photo_file" accept="image/*" onchange="handlePhotoUpload(this)">
        <div id="photo_preview_wrap" style="display:${activePhoto ? 'flex' : 'none'};gap:8px;align-items:center;margin-top:6px">
          <img id="photo_preview_img" src="${activePhoto}" style="width:60px;height:60px;border-radius:8px;object-fit:cover">
          <button class="d" style="font-size:11px" onclick="activePhoto='';$('photo_preview_wrap').style.display='none'">Remove Photo</button>
        </div>
      </div>

      <button style="width:100%;margin-top:8px" onclick="saveDoc('${id || ''}')">Save Doctor Profile</button>
    </div>
  `;
}

async function saveDoc(id) {
  const name = $('df_name').value.trim();
  if (!name) return alert('Doctor name required');
  await put('docs', {
    name,
    qual: $('df_qual').value.trim(),
    spec: $('df_spec').value.trim(),
    extra: $('df_extra').value.trim(),
    clinic: $('df_clinic').value.trim(),
    photo: activePhoto,
    id: id || undefined
  });
  back();
}

async function delDoc(id) {
  if (!confirm('Delete doctor and all assigned prescriptions?')) return;
  for (const l of S.dm.filter(x => x.doctorId === id)) {
    await col('dm').doc(l.id).delete();
  }
  await del('docs', id);
  back();
}

function pickDocMed(doctorId) {
  const assigned = new Set(S.dm.filter(x => x.doctorId === doctorId).map(x => x.medId));
  let searchDoc = '';

  const renderPicker = () => {
    const filtered = S.meds.filter(m => find(searchDoc, m));
    $('m').innerHTML = `
      ${bk('Assign Medicine to Doctor')}
      <input id="picker_search" placeholder="Search catalog medicines..." value="${esc(searchDoc)}" oninput="searchDoc=this.value;renderPickerKeep()">
      <div class="grid" style="margin-top:8px">
        ${srt(filtered).map(m => `
          <div class="card med">
            <div style="flex:1;min-width:0">
              <b>${esc(brandOf(m))}</b>
              <div class="comp">${esc(m.composition || '')}</div>
              <div class="co">${esc(m.company || '')}</div>
              ${assigned.has(m.id) ? `
                <span class="sb" style="background:#d1fae5;color:#065f46">✓ Already Assigned</span>
              ` : `
                <button style="padding:4px 10px;font-size:11px;margin-top:4px" onclick="linkMedDoc('${doctorId}','${m.id}')">+ Add to Doctor</button>
              `}
            </div>
            ${photo(m.photo)}
          </div>
        `).join('')}
      </div>
    `;
  };

  window.renderPickerKeep = () => {
    const el = $('picker_search');
    const p = el ? el.selectionStart : 0;
    renderPicker();
    const rel = $('picker_search');
    if (rel) { rel.focus(); rel.setSelectionRange(p, p); }
  };

  window.linkMedDoc = async (docId, medId) => {
    if (S.dm.some(x => x.doctorId === docId && x.medId === medId)) return;
    await put('dm', { doctorId: docId, medId });
    assigned.add(medId);
    renderPicker();
  };

  window.unlinkDocMed = async (linkId) => {
    if (!confirm('Remove medicine from this doctor?')) return;
    await col('dm').doc(linkId).delete();
    draw();
  };

  renderPicker();
}

/* Expiry Form */
function expForm(id) {
  if (!isA()) return alert('Admin mode required');
  const x = S.exp.find(e => e.id === id) || {};
  activePhoto = x.photo || '';

  $('m').innerHTML = `
    ${bk(id ? 'Edit Batch Record' : 'Add Expiry / Non-Moving Batch')}
    <div class="card">
      <small style="font-weight:700">Quick-Fill from Medicine Catalog</small>
      <select id="ef_pick" onchange="autoFillExp(this.value)">
        <option value="">— Select Catalog Medicine —</option>
        ${srt(S.meds).map(m => `<option value="${m.id}" ${x.medId === m.id ? 'selected' : ''}>${esc(brandOf(m))} (${esc(m.composition || '')})</option>`).join('')}
      </select>
      <small style="font-weight:700">Medicine Name *</small>
      <input id="ef_name" placeholder="Brand / Medicine Name" value="${esc(x.name || '')}">
      <small style="font-weight:700">Composition / Content</small>
      <input id="ef_comp" placeholder="Composition" value="${esc(x.composition || '')}">
      <small style="font-weight:700">Manufacturer</small>
      <input id="ef_co" placeholder="Company" value="${esc(x.company || '')}">
      
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
        <div>
          <small style="font-weight:700">Batch No.</small>
          <input id="ef_batch" placeholder="e.g. B-102" value="${esc(x.batch || '')}">
        </div>
        <div>
          <small style="font-weight:700">MRP Amount (₹)</small>
          <input id="ef_mrp" type="number" step="0.01" placeholder="0.00" value="${esc(x.mrp || '')}">
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
        <div>
          <small style="font-weight:700">Quantity (Units / Strips) *</small>
          <input id="ef_qty" type="number" value="${esc(x.qty || 1)}">
        </div>
        <div>
          <small style="font-weight:700">Expiry Date</small>
          <input id="ef_date" type="date" value="${esc(x.expiry || '')}">
        </div>
      </div>

      <label style="display:flex;align-items:center;gap:6px;margin:8px 0;font-size:13px;font-weight:700">
        <input type="checkbox" id="ef_nonMoving" style="width:auto" ${x.nonMoving ? 'checked' : ''}> Non-moving stock entry
      </label>

      <div style="background:#f1f5f4;padding:10px;border-radius:10px;margin:8px 0">
        <small style="font-weight:700;display:block;margin-bottom:4px">Medicine Batch Photo</small>
        <input type="file" id="ef_photo_file" accept="image/*" onchange="handlePhotoUpload(this)">
        <div id="photo_preview_wrap" style="display:${activePhoto ? 'flex' : 'none'};gap:8px;align-items:center;margin-top:6px">
          <img id="photo_preview_img" src="${activePhoto}" style="width:60px;height:60px;border-radius:8px;object-fit:cover">
          <button class="d" style="font-size:11px" onclick="activePhoto='';$('photo_preview_wrap').style.display='none'">Remove Photo</button>
        </div>
      </div>

      <button style="width:100%;margin-top:8px" onclick="saveExp('${id || ''}')">Save Batch Record</button>
    </div>
  `;
}

window.autoFillExp = function(medId) {
  const m = S.meds.find(x => x.id === medId);
  if (m) {
    $('ef_name').value = brandOf(m);
    $('ef_comp').value = m.composition || '';
    $('ef_co').value = m.company || '';
    if (m.photo && !activePhoto) {
      activePhoto = m.photo;
      $('photo_preview_img').src = activePhoto;
      $('photo_preview_wrap').style.display = 'flex';
    }
  }
};

async function saveExp(id) {
  const name = $('ef_name').value.trim();
  if (!name) return alert('Medicine name required');

  await put('exp', {
    name,
    composition: $('ef_comp').value.trim(),
    company: $('ef_co').value.trim(),
    batch: $('ef_batch').value.trim(),
    mrp: $('ef_mrp').value.trim(),
    qty: Number($('ef_qty').value) || 0,
    expiry: $('ef_date').value,
    nonMoving: $('ef_nonMoving').checked,
    medId: $('ef_pick').value,
    photo: activePhoto,
    id: id || undefined
  });
  back();
}

function downloadJsonBackup() {
  const data = JSON.stringify({ version: "5.0", timestamp: now(), data: S }, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `MAULI_MEDICOSE_BACKUP_${now().slice(0, 10)}.json`;
  a.click();
}

function triggerRestore() {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.json';
  inp.onchange = async () => {
    try {
      const parsed = JSON.parse(await inp.files[0].text());
      const source = parsed.data || parsed;
      if (!confirm('Merge restore data into cloud? Existing records will not be lost.')) return;
      for (const k of ['cls', 'dos', 'docs', 'meds', 'dm', 'exp']) {
        if (Array.isArray(source[k])) {
          for (const item of source[k]) {
            if (!S[k].some(x => x.id === item.id)) {
              await col(k).doc(item.id).set(item, { merge: true });
            }
          }
        }
      }
      alert('✅ Restore complete! Synced with cloud.');
      draw();
    } catch(e) {
      alert('Invalid backup file');
    }
  };
  inp.click();
}

function draw() {
  const root = route[0];
  if (root === 'home') {
    $('hd').innerHTML = fullHdr();
  } else {
    let title = 'MAULI MEDICOSE';
    if (root === 'meds') title = tab === 'master' && isA() ? 'Master Medicine List' : 'Mauli Medicine List';
    else if (root === 'cls') title = route[1] ? (S.cls.find(x => x.id === route[1])?.name || 'Class Details') : 'Classification';
    else if (root === 'dos') title = route[1] ? (S.dos.find(x => x.id === route[1])?.name || 'Dosage Details') : 'Dosage Forms';
    else if (root === 'docs') title = route[1] ? (S.docs.find(x => x.id === route[1])?.name || 'Doctor Medicines') : 'Doctors';
    else if (root === 'exp') title = 'Expiry & Non-Moving';
    else if (root === 'more') title = route[1] === 'set' ? 'Pharmacy Details' : 'Settings & Admin';
    $('hd').innerHTML = subHdr(title);
  }

  // Bottom Navigation
  const tabs = [
    ['home', '🏠', 'Home'],
    ['meds', '📋', 'Mauli List'],
    null, // FAB button
    ['docs', '🩺', 'Doctors'],
    ['more', '⚙', isA() ? 'Admin' : 'Settings']
  ];

  $('nv').innerHTML = tabs.map(t => {
    if (!t) {
      return `<div class="fab" onclick="handleFab()">${isA() ? '+' : '⌕'}</div>`;
    }
    return `
      <a class="${route[0] === t[0] ? 'on' : ''}" onclick="go('${t[0]}')">
        <i>${t[1]}</i>${t[2]}
      </a>
    `;
  }).join('');

  // Main View
  const viewFn = V[root] || V.home;
  $('m').innerHTML = viewFn(route) + `
    <footer>
      © ${new Date().getFullYear()} MAULI MEDICOSE. All Rights Reserved.<br>
      <span>Registered Pharmacy Inventory System • Real-Time Cloud Sync</span>
    </footer>
  `;
}

function handleFab() {
  if (isA()) {
    medForm();
  } else {
    go('meds');
    setTimeout(() => {
      const el = $('sq');
      if (el) el.focus();
    }, 80);
  }
}

/* Kickoff */
initRealtimeSync();
draw();
</script>
</body>
